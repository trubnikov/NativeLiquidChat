name: NativeLiquidChat
options:
  bundleIdPrefix: com.dimatrubnikov
  deploymentTarget:
    iOS: "18.5"

packages:
  LeapSDK:
    url: https://github.com/Liquid4All/leap-ios
    minorVersion: 0.9.4

targets:
  NativeLiquidChat:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: MLModels
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimatrubnikov.NativeLiquidChat
        DEVELOPMENT_TEAM: Q4MWQ3X44V
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Offline AI"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "We need access to your camera to capture images for the visual model."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "We need access to your microphone to capture audio prompts."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition runs on-device to turn your voice into text for hands-free conversation."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "We need access to your photo library to select images for the visual model."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: 5.9
    dependencies:
      - package: LeapSDK
        product: LeapSDK

  NativeLiquidChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimatrubnikov.NativeLiquidChatTests
        DEVELOPMENT_TEAM: Q4MWQ3X44V
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
    dependencies:
      - target: NativeLiquidChat

schemes:
  NativeLiquidChat:
    build:
      targets:
        NativeLiquidChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NativeLiquidChatTests
