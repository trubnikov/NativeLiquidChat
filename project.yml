name: NativeLiquidChat
options:
  bundleIdPrefix: com.dimatrubnikov
  deploymentTarget:
    iOS: 18.0

packages:
  LeapSDK:
    url: https://github.com/Liquid4All/leap-sdk
    majorVersion: 0.10.0

targets:
  NativeLiquidChat:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: MLModels
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimatrubnikov.NativeLiquidChat
        DEVELOPMENT_TEAM: Q4MWQ3X44V
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "We need access to your camera to capture images for the visual model."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "We need access to your microphone to capture audio prompts."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition runs on-device to turn your voice into text for hands-free conversation."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "We need access to your photo library to select images for the visual model."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: 5.9
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) LEAP_DUAL_IMPORT_ALLOW=1"
        OTHER_SWIFT_FLAGS: "$(inherited) -DLEAP_DUAL_IMPORT_ALLOW"
        OTHER_LDFLAGS: "$(inherited) -ObjC -L$(BUILT_PRODUCTS_DIR)/LeapSDK.framework/Frameworks -L$(BUILT_PRODUCTS_DIR)/LeapModelDownloader.framework/Frameworks -linference_engine -linference_engine_llamacpp_backend"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/Frameworks/LeapSDK.framework/Frameworks @executable_path/Frameworks/LeapModelDownloader.framework/Frameworks"
    dependencies:
      - package: LeapSDK
        product: LeapSDK
      - package: LeapSDK
        product: LeapModelDownloader
    postBuildScripts:
      - name: Sign nested LeapSDK dylibs
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks"
          [ -d "$FRAMEWORKS_DIR" ] || exit 0
          [ "$CODE_SIGNING_ALLOWED" = "YES" ] || exit 0
          find "$FRAMEWORKS_DIR" -name "*.dylib" | while read dylib; do
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$dylib"
          done

  NativeLiquidChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimatrubnikov.NativeLiquidChatTests
        DEVELOPMENT_TEAM: Q4MWQ3X44V
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) LEAP_DUAL_IMPORT_ALLOW=1"
        OTHER_SWIFT_FLAGS: "$(inherited) -DLEAP_DUAL_IMPORT_ALLOW"
    dependencies:
      - target: NativeLiquidChat

schemes:
  NativeLiquidChat:
    build:
      targets:
        NativeLiquidChat: [run, test, profile, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NativeLiquidChatTests
