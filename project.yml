name: NativeLiquidChat
options:
  bundleIdPrefix: com.dimatrubnikov
  deploymentTarget:
    iOS: 17.0

packages:
  LeapSDK:
    url: https://github.com/Liquid4All/leap-sdk
    majorVersion: 0.10.0

targets:
  NativeLiquidChat:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimatrubnikov.NativeLiquidChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "We need access to your camera to capture images for the visual model."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "We need access to your microphone to capture audio prompts."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "We need access to your photo library to select images for the visual model."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: 5.9
        OTHER_LDFLAGS: "$(inherited) -ObjC -L$(BUILT_PRODUCTS_DIR)/LeapSDK.framework/Frameworks -L$(BUILT_PRODUCTS_DIR)/LeapModelDownloader.framework/Frameworks -linference_engine -linference_engine_llamacpp_backend"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/Frameworks/LeapSDK.framework/Frameworks @executable_path/Frameworks/LeapModelDownloader.framework/Frameworks"
    dependencies:
      - package: LeapSDK
        product: LeapSDK
      - package: LeapSDK
        product: LeapModelDownloader
    postBuildScripts:
      - name: Sign nested LeapSDK dylibs
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks"
          [ -d "$FRAMEWORKS_DIR" ] || exit 0
          [ "$CODE_SIGNING_ALLOWED" = "YES" ] || exit 0
          find "$FRAMEWORKS_DIR" -name "*.dylib" | while read dylib; do
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$dylib"
          done
